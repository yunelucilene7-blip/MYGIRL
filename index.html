<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão de Aniversário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="birthdayCard">
    <!-- Frente do cartão -->
    <div class="cardFront">
      <div class="front-text">
        <div class="happy">Feliz</div>
        <div class="toyou">Aniversário</div>
        <div class="bday">Minha Princesa!</div>
      </div>

      <!-- Decorações e bolo -->
      <div class="wrap-deco">
        <div class="decorations"></div>
        <div class="decorationsTwo"></div>
        <div class="decorationsThree"></div>
      </div>
      <div class="wrap-decoTwo">
        <div class="decorationsTwo"></div>
        <div class="decorationsThree"></div>
      </div>
      <div class="plate"></div>
      <div class="cake"></div>
      <div class="flame"></div>
    </div>

    <!-- Interior do cartão -->
    <div class="cardInside">
      <div class="inside-text">
        <h3>Feliz Aniversário, minha princesa! 🎂❤️</h3>
        <div class="wishes">
          <p>Hoje é o teu dia e eu só quero celebrar a tua vida.</p>
          <p>Que o teu sorriso continue iluminando tudo à tua volta.</p>
          <p>Que este novo ano seja cheio de saúde, amor e alegrias.</p>
          <p>Eu amo-te muito! ❤️</p>
        </div>
        <div class="name">
          <p>Do teu amor.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const card = document.querySelector(".birthdayCard");
    card.addEventListener("click", () => {
      card.classList.toggle("open");
    });
  </script>

</body>
</html>
